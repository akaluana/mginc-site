<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio — MG Inc</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>

<div id="nav-placeholder"></div>
<script>
  fetch("/partials/nav.html")
    .then(r => r.text())
    .then(html => document.getElementById("nav-placeholder").innerHTML = html);
</script>

<section class="hero">
  <h1>Portfolio</h1>
  <p>Selected case studies and engineering work.</p>
</section>

<section class="section">
  <div class="portfolio-tabs">
    <button class="tab active" data-tab="gallery">Gallery</button>
    <button class="tab" data-tab="case-studies">Case Studies</button>
  </div>

  <!-- GALLERY TAB -->
  <div id="gallery-tab" class="tab-content active">
    <div id="gallery-grid"></div>
  </div>

  <!-- CASE STUDIES TAB -->
  <div id="case-studies-tab" class="tab-content">
    <div id="portfolio-grid"></div>
  </div>

  <div id="portfolio-grid" class="portfolio-grid"></div>
</section>

<div id="portfolio-modal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close">×</button>
    <div class="modal-body"></div>
  </div>
</div>

<!-- GALLERY LIGHTBOX -->
<div id="gallery-lightbox" class="modal hidden">
  <div class="modal-content gallery-lightbox-content">
    <button class="modal-close gallery-lightbox-close">×</button>
    <button class="gallery-nav left">‹</button>
    <img id="gallery-lightbox-image" src="">
    <button class="gallery-nav right">›</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/portfolio/portfolio.js"></script>

</body>
</html>
